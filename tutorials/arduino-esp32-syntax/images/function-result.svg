<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#227C6D" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1280" height="760" rx="0" fill="#F5F4EE" stroke="none" stroke-width="3"/><text x="64" y="83" text-anchor="start" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="50" font-weight="700">返回结果，和把结果显示出来，是两件事</text><text x="64" y="137" text-anchor="start" fill="#536C79" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400">示例：int total = add(3, 4); 然后 Serial.println(total);</text><rect x="65" y="211" width="325" height="250" rx="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><rect x="477" y="211" width="325" height="250" rx="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><rect x="889" y="211" width="325" height="250" rx="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><text x="96" y="266" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="600">① 调用函数</text><text x="508" y="266" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="600">② 保存结果</text><text x="920" y="266" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="600">③ 打印文字</text><text x="227" y="354" text-anchor="middle" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="600">add(3, 4)</text><text x="640" y="354" text-anchor="middle" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="600">total = 7</text><text x="1052" y="354" text-anchor="middle" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="600">串口显示 7</text><path d="M403 334H462" fill="none" stroke="#227C6D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M815 334H874" fill="none" stroke="#227C6D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="81" y="523" text-anchor="start" fill="#536C79" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400">return 7 只交回数值；Serial.println 才负责显示。</text><rect x="48" y="634" width="1184" height="86" rx="16" fill="#E2EDE7" stroke="none" stroke-width="3"/><text x="80" y="689" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="600">只调用 add(3, 4);，不会自动在窗口中看见 7。</text></svg>