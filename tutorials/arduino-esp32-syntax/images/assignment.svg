<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#227C6D" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F5F4EE" stroke="none" stroke-width="3"/><text x="64" y="83" text-anchor="start" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="50" font-weight="700">赋值：先算出新值，再保存</text><text x="64" y="137" text-anchor="start" fill="#536C79" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400">示例：count 已经是 0，然后执行 count = count + 1;</text><rect x="64" y="206" width="330" height="280" rx="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><rect x="475" y="206" width="330" height="280" rx="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><rect x="886" y="206" width="330" height="280" rx="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><text x="96" y="263" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="600">① 取旧值</text><text x="507" y="263" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="600">② 做计算</text><text x="918" y="263" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="600">③ 保存结果</text><text x="229" y="369" text-anchor="middle" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="600">count = 0</text><text x="640" y="369" text-anchor="middle" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="600">0 + 1 → 1</text><text x="1051" y="369" text-anchor="middle" fill="#213743" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="600">count = 1</text><path d="M405 348H460" fill="none" stroke="#227C6D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M816 348H872" fill="none" stroke="#227C6D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="596" width="1184" height="86" rx="16" fill="#E2EDE7" stroke="none" stroke-width="3"/><text x="80" y="651" text-anchor="start" fill="#227C6D" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="600">等号在这里表示赋值，不是数学中的相等方程。</text></svg>