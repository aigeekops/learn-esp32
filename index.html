<!doctype html>
<html lang="zh-CN" class="is-loading">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4efe3">
<meta name="description" content="在浏览器里探索 ESP32：交互式 3D 电路、16 节中文课程、实时参数和 Arduino 代码。">
<title>ESP32 入门 · 探索、理解、动手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='5' width='22' height='22' rx='5' fill='%235a8788'/%3E%3Cpath d='M11 11h10v10H11z' fill='%23f4efe3'/%3E%3C/svg%3E">
<script defer src="https://cloud.umami.is/script.js" data-website-id="6f691d2f-f286-44ec-ab22-a10b3e5b5315" data-domains="aigeekops.github.io" data-analytics="umami"></script>
<style>
/* Boot screen: inlined so it paints before the module bundle is ready. */
html.is-loading{overflow:hidden}
.boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#f3eedf;transition:opacity .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.boot:before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,#cec0ad52 1px,transparent 1px),linear-gradient(#cec0ad52 1px,transparent 1px);background-position:50%;background-size:28px 28px;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%)}
.boot.is-done{opacity:0;visibility:hidden;pointer-events:none}
.boot-inner{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.boot-logo{width:64px;height:64px;color:#26324d}
.boot-logo .chip{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.boot-title{margin:14px 0 0;font-family:"Barlow Semi Condensed","PingFang SC","Microsoft YaHei",sans-serif;font-size:27px;font-weight:600;line-height:30px;letter-spacing:.13em;text-transform:uppercase;color:#18213d;white-space:nowrap}
.boot-track{position:relative;width:220px;height:8px;margin-top:22px;border-radius:4px;background:#e3d8ca;overflow:hidden}
.boot-fill{position:absolute;inset:0;transform:scaleX(.04);transform-origin:0;background:linear-gradient(#2aa9a4,#1c8781);transition:transform .45s cubic-bezier(.2,.8,.2,1);animation:boot-fill .9s cubic-bezier(.2,.8,.2,1) forwards}
.boot.is-done .boot-fill{animation:none}
.boot-shine{position:absolute;top:0;bottom:0;left:0;width:36%;background:linear-gradient(90deg,transparent,#ffffff80,transparent);animation:boot-shine 1.4s cubic-bezier(.4,0,.2,1) infinite}
.boot-step{min-height:18px;margin:12px 0 0;font-family:"Barlow Semi Condensed","PingFang SC","Microsoft YaHei",sans-serif;font-size:13.5px;font-weight:500;line-height:18px;letter-spacing:.16em;text-transform:uppercase;color:#ada293;white-space:nowrap}
.boot.is-failed .boot-track{display:none}
.boot.is-failed .boot-step{max-width:340px;font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:22px;letter-spacing:0;text-transform:none;white-space:normal;text-align:center;color:#303647}
@keyframes boot-fill{from{transform:scaleX(.04)}to{transform:scaleX(.62)}}
@keyframes boot-shine{0%{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.boot{transition-duration:10ms}.boot-shine,.boot-fill{animation:none}}
</style>
</head>
<body>
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-inner">
    <svg class="boot-logo" viewBox="0 0 24 24" aria-hidden="true"><g class="chip"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/><rect x="9" y="9" width="6" height="6"/></g></svg>
    <p class="boot-title">ESP32 入门</p>
    <div class="boot-track" aria-hidden="true"><span class="boot-fill"></span><span class="boot-shine"></span></div>
    <p class="boot-step">加载中</p>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
